<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>FitForge PWA | Entrenamiento Inteligente</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1>FitForge</h1>
        <button id="theme-toggle" class="btn btn-ghost" type="button">🌙</button>
      </header>

      <main>
        <section id="onboarding" class="card" aria-live="polite"></section>

        <section id="dashboard" class="card hidden">
          <div class="section-head">
            <h2>Panel de progreso</h2>
            <p id="profile-summary"></p>
          </div>
          <div class="grid metrics-grid" id="metrics-cards"></div>

          <div class="panel">
            <h3>Evolución de peso</h3>
            <canvas id="progress-chart" width="600" height="240" aria-label="Gráfico de evolución"></canvas>
          </div>

          <div class="panel">
            <h3>Registrar sesión</h3>
            <form id="session-form" class="stack">
              <label>
                Fecha
                <input type="date" name="date" required />
              </label>
              <label>
                Peso corporal (kg)
                <input type="number" name="weight" min="30" max="350" step="0.1" required />
              </label>
              <label>
                Tiempo entrenado (min)
                <input type="number" name="duration" min="5" max="300" required />
              </label>
              <label>
                Notas de sesión
                <textarea name="notes" maxlength="280" placeholder="¿Cómo te sentiste hoy?"></textarea>
              </label>
              <label>
                Fallos en series (0-10)
                <input type="number" name="failCount" min="0" max="10" value="0" required />
              </label>
              <label class="inline-check">
                <input type="checkbox" name="completedAllSets" />
                Completé todas las series
              </label>
              <button class="btn" type="submit">Guardar entrenamiento</button>
            </form>
          </div>

          <div class="panel">
            <h3>Rutina recomendada de la semana</h3>
            <ul id="routine-list" class="stack"></ul>
          </div>

          <div class="panel">
            <div id="timer-panel"></div>
          </div>


          <div class="panel">
            <h3>Biblioteca de ejercicios</h3>
            <div id="exercise-library"></div>
          </div>

          <div class="panel">
            <h3>Historial reciente</h3>
            <ul id="history-list" class="stack"></ul>
          </div>
        </section>
      </main>
    </div>


    <div id="exercise-modal" class="exercise-modal" aria-hidden="true">
      <div class="exercise-modal-backdrop"></div>
      <div class="exercise-modal-content" role="dialog" aria-modal="true" aria-label="Detalle de ejercicio">
        <button class="exercise-modal-close" type="button" data-modal-close>✕</button>
        <h3 data-modal-title>Ejercicio</h3>
        <p class="exercise-modal-meta" data-modal-meta></p>
        <p data-modal-body></p>
        <div data-modal-video></div>
      </div>
    </div>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
